services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"${OLLAMA_MODEL:-qwen2.5:1.5b}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull "${OLLAMA_MODEL:-qwen2.5:1.5b}"
        wait
    networks: [tutorial-net]

  mcp-server:
    build: ./mcp_server
    env_file: .env
    environment:
      MCP_PORT: "8000"
    ports:
      # Puerto host 8090 (no 8000) para no chocar con otros stacks locales
      # (ej. chromadb de jub-agent suele ocupar 8000/8001 en esta máquina).
      - "8090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tutorial-net]

  agent:
    build: ./agent
    env_file: .env
    environment:
      OLLAMA_URL: "http://ollama:11434"
      MCP_SERVER_URL: "http://mcp-server:8000/mcp"
    ports:
      - "8091:8081"
    depends_on:
      ollama:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [tutorial-net]

networks:
  tutorial-net:

volumes:
  ollama_data:
